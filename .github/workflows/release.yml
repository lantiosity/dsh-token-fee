name: Release

# 打 tag（v0.6.1 这种）即发布：先跑发布闸门，再用 npm 的 Trusted Publishing（OIDC）
# 发布并生成 provenance，最后用 release notes 文件创建 GitHub Release。
#
# 为什么走 OIDC 而不是把 token 存进 repo secret：npm 的 trusted publisher 让 CI 用
# GitHub 的短期 OIDC 令牌换一次性发布凭证，仓库里没有任何可长期使用的 npm 凭证；
# provenance 还能把 tarball 与这次提交绑定，可在线核验。
# 也兼容 NPM_TOKEN（若配置了 secret 就用它），方便还没在 npm 上配置 trusted publisher 时过渡。
#
# 手动触发只会做 `npm publish --dry-run`（冒烟验证），真实发布只由 tag 推送触发。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # 创建 GitHub Release
  id-token: write # npm Trusted Publishing（OIDC）必需

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: 校验版本与 tag 一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json 是 $PKG_VERSION，tag 是 $TAG_VERSION —— 两者必须一致"
            exit 1
          fi
          echo "版本一致：$PKG_VERSION"

      - name: 发布闸门（离线套件 / 安装器 / 组件级 / 闸门语义）
        run: npm run verify

      - name: npm publish --dry-run（手动触发冒烟）
        if: github.event_name == 'workflow_dispatch'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "使用 NPM_TOKEN 凭证（dry-run）"
          else
            echo "未配置 NPM_TOKEN：走 npm Trusted Publishing（OIDC，dry-run）"
          fi
          # 当前版本通常已经发布过，npm 连 dry-run 都会拒绝「重复版本」。冒烟用一个
          # 一次性的预发布版本号，只验证打包与发布参数，不碰仓库里的真实版本。
          npm version "0.0.0-smoke.$(date +%s)" --no-git-tag-version --allow-same-version
          npm publish --provenance --access public --tag smoke --dry-run

      - name: 发布到 npm（provenance）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "使用 NPM_TOKEN 凭证"
          else
            echo "未配置 NPM_TOKEN：走 npm Trusted Publishing（OIDC）"
          fi
          npm publish --provenance --access public

      - name: 核对 registry 上的版本
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for attempt in 1 2 3 4 5; do
            PUBLISHED="$(npm view "@lantiosity/dsh-token-fee@$VERSION" version 2>/dev/null || true)"
            if [ "$PUBLISHED" = "$VERSION" ]; then
              echo "registry 上已是 $VERSION"
              exit 0
            fi
            echo "第 $attempt 次未读到 $VERSION，稍后重试…"
            sleep 10
          done
          echo "::error::发布后 registry 上读不到 $VERSION"
          exit 1

      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$NOTES" --verify-tag
          else
            echo "::warning::缺少 $NOTES，改用自动生成的 release notes"
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
